<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Комикс-рогалик</title>
  <meta name="description" content="Демо: страница комикса собирается из твоих выборов.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Neucha&family=Rubik:wght@400;500;700&family=Russo+One&display=swap&subset=cyrillic" rel="stylesheet">
</head>
<body>
  <header class="top">
    <div class="brand">
      <b>Комикс-рогалик</b>
      <span>демо-пролог · выпуск «Город»</span>
    </div>
    <nav class="tools" aria-label="Управление">
      <div class="seg" role="group" aria-label="Герой">
        <button data-g="male" aria-pressed="true">Он</button>
        <button data-g="female" aria-pressed="false">Она</button>
      </div>
      <button id="restart">Заново</button>
      <button id="savePage">Скачать страницу</button>
      <button id="saveComic">Скачать комикс</button>
    </nav>
  </header>

  <main class="layout">
    <section id="pages" aria-label="Комикс"></section>
    <aside class="side">
      <div class="hero">
        <canvas id="heroCv" width="416" height="608" role="img" aria-label="Герой"></canvas>
        <div>
          <div class="label">Предыстория</div>
          <div id="backstory"></div>
          <div class="label">Карманы</div>
          <div id="pockets"></div>
        </div>
      </div>
      <div id="choose" class="choose">
        <h2 id="chooseTitle">…</h2>
        <p class="tip desk">Наведи на вариант, чтобы примерить его кадр на страницу.</p>
        <div id="choices"></div>
      </div>
    </aside>
  </main>

  <footer>
    <p id="missing" hidden></p>
    <p>Картинки делает ночная генерация. После неё <code>comix.bat export-game</code> и push обновят эту страницу.</p>
  </footer>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
