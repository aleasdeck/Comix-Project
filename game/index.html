<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Комикс-рогалик</title>
  <meta name="description" content="Пошаговый комикс-рогалик: каждая развилка добавляет кадры, готовый забег сохраняется выпуском.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Neucha&family=Rubik:wght@400;500;700&family=Russo+One&display=swap&subset=cyrillic" rel="stylesheet">
</head>
<body>
  <header class="top">
    <div class="brand">
      <b>Комикс-рогалик</b>
      <span>выпуск №1 «Город»</span>
    </div>
    <button id="heroBtn" class="hero-chip" hidden aria-haspopup="dialog" title="Карточка героя">
      <span class="chip-pic"></span>
      <span class="chip-txt"></span>
    </button>
    <button id="menuBtn" class="ghost menu-btn" aria-expanded="false" aria-controls="tools" aria-label="Меню">☰</button>
    <nav id="tools" class="tools" aria-label="Управление">
      <button id="restart">Новый выпуск</button>
      <button id="savePage">Скачать страницу</button>
      <button id="saveComic">Скачать выпуск</button>
    </nav>
  </header>

  <main class="layout">
    <section class="book" aria-label="Комикс">
      <div class="book-frame"><div id="pages"></div></div>
      <nav class="pager" aria-label="Страницы">
        <button id="prevPage" class="ghost" aria-label="Предыдущая страница">‹</button>
        <span id="pageNo" aria-live="polite"></span>
        <button id="nextPage" class="ghost" aria-label="Следующая страница">›</button>
      </nav>
    </section>
    <aside class="side">
      <div id="choose" class="choose">
        <div class="choose-head">
          <h2 id="chooseTitle">…</h2>
          <button id="sheetBtn" class="ghost sheet-btn" aria-expanded="true" aria-controls="choices" aria-label="Свернуть выбор, чтобы видеть страницу">▾</button>
        </div>
        <p class="tip desk">Наведи на вариант, чтобы примерить его кадр на страницу.</p>
        <div id="choices"></div>
      </div>
      <p id="missing" hidden></p>
    </aside>
  </main>

  <dialog id="heroDlg" class="hero-dlg" aria-labelledby="heroDlgTitle">
    <div class="dlg-head">
      <h2 id="heroDlgTitle">Герой</h2>
      <button id="heroClose" class="ghost" aria-label="Закрыть">✕</button>
    </div>
    <div id="hero" class="hero-card"></div>
  </dialog>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
