# Наклейки: артефакты забега. Наклейку надо куда-то наклеить, и место решает, что она делает.
# Мест мало: битка 2, вещь 1 на вещь, обложка 3. Новая наклейка поверх старой её заменяет.
# where: bat | item | cover. id картинки: assets/sprites/stickers/<id>.

stickers:
