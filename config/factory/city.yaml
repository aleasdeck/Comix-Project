  hourglass:   {title: "Песочные часы", prompt: "an hourglass with golden sand"}
  key:         {title: "Ключ",         prompt: "an old golden key"}
  bomb:        {title: "Бомба",        prompt: "a round black cartoon bomb with a lit fuse"}
