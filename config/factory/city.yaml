# Ночная фабрика ассетов: всё, что нужно игре для мира «Город».
# Запуск: comix night            (сухой прогон с подсчётом времени: comix night --dry-run)
# Готовое не перегенерируется, поэтому прерванный запуск просто продолжается с места остановки.
# Промпты на английском: так их лучше понимают klein и qwen.

world: city
title: "Город"

# Секунд на одну картинку, только для оценки времени в сухом прогоне
seconds:
  klein_edit: 20
  klein: 15
  qwen: 30

# --- Герой: бумажная кукла в 10 позах -------------------------------------------
hero:
  genders: [male, female]
  poses: [idle, talk, cross, point, think, walk, run, fight, shock, victory]
  # вариантов базы на позу: 2 по скелету + 1 только по тексту, лучший выбирается автоматически
  pose_candidates: 3
  sets: ["Городской", "Детектив", "Герой"]   # 12 вещей из wardrobe.yaml
  # лут города: тоже вещи из wardrobe.yaml
  extra_items:
    head: [beanie, bandana, gas_mask]
    top: [leather_jacket, business_shirt]
    bottom: [cargo_pants]
    shoes: [combat_boots, boots]
  # эмоции слоем лица; нейтральная это сама база
  emotions:
    joy:      "a big happy open-mouthed smile and cheerful eyes"
    anger:    "an angry expression with furrowed eyebrows and gritted teeth"
    surprise: "a surprised expression with raised eyebrows, wide eyes and a round open mouth"
    sad:      "a sad expression with eyebrows angled up and a downturned mouth"
    smirk:    "a sly smirk with one corner of the mouth raised and narrowed eyes"
    tired:    "an exhausted expression with half-closed droopy eyes, a slightly open mouth and a sweat drop"
  # одна автоматическая перегенерация вещи, если правка задела фигуру вне своего слота
  qa_retry: true
  qa_retry_max: 80      # не больше стольких перегенераций за ночь (самые плохие первыми)

# --- Лица и причёски для NPC (слой лица поверх той же куклы) --------------------
npc_faces:
  male:
    old_cop:   "an older man in his sixties with short grey hair, a thick grey moustache and wrinkles"
    bald:      "a bald man with a heavy brow and dark stubble"
    nerd:      "a young man with messy curly brown hair and round glasses"
    punk:      "a young man with a tall spiky green mohawk"
    bearded:   "a man with a full black beard and long black hair tied in a bun"
    grandpa:   "an elderly man with thin white hair, bushy white eyebrows and a short white beard"
    slick:     "a man with slicked-back black hair and a thin moustache"
    teen:      "a teenage boy with a messy blond fringe and freckles"
  female:
    old_lady:  "an elderly woman with grey hair in a loose bun and wrinkles"
    punk:      "a young woman with a short pink pixie cut and an eyebrow piercing"
    office:    "a woman with a neat black bob haircut and glasses"
    afro:      "a woman with big curly afro hair"
    ponytail:  "a young woman with a long blonde ponytail"
    braids:    "a woman with long dark box braids"
    redhead:   "a woman with wavy red shoulder-length hair and freckles"
    teen:      "a teenage girl with two short pigtails"

# --- Враги, подручные и злодей: база + 3 позы правкой базы ----------------------
creature_poses:
  stand:    "standing in a ready stance, facing the viewer"
  attack:   "attacking, lunging forward toward the viewer"
  hit:      "recoiling from a hit, knocked back, grimacing in pain"
  defeated: "defeated, lying knocked out on the ground, dazed"

enemies:
  guard_dog:
    title: "Сторожевой пёс"
    prompt: "a muscular black-and-tan guard dog in a spiked collar, side view, growling"
    poses: {defeated: "lying on its side on the ground, knocked out with its tongue out"}
  drone:
    title: "Охранный дрон"
    prompt: "a small flying quadcopter security drone machine: a round white robot body with four propeller arms, a red camera eye and a small stun gun underneath, no person, no human body, no arms, no legs"
    frame: "the whole drone visible with empty space around it, centered"
    poses:
      stand: "hovering in the air, facing the viewer"
      attack: "diving toward the viewer, firing a blue electric zap from its stun gun"
      hit: "tilted and wobbling in the air after a hit, sparks flying"
      defeated: "crashed on the ground, broken, sparking and smoking"
  riot_robot:
    title: "Робот-охранник"
    prompt: "a bulky two-legged riot-control security robot with blue and white armor plates and a riot shield, original design"
    poses: {defeated: "collapsed on the ground, broken, sparking"}
  mutant:
    title: "Мутант из канализации"
    prompt: "a hunched sewer mutant creature with green slimy skin, glowing yellow eyes and torn grey clothes"
  brute:
    title: "Громила"
    prompt: "a huge muscular bald street brute in a torn black tank top with a heavy chain wrapped around his fist"

bosses:
  gang_boss:
    title: "Глава банды (подручная, глава 1)"
    prompt: "a tough gang leader woman with a shaved undercut, a red bomber jacket, ripped jeans and brass knuckles"
  security_chief:
    title: "Шеф охраны (подручный, глава 1)"
    prompt: "a cold corporate security chief man in a black suit with a chrome cybernetic arm and dark sunglasses"
  villain:
    title: "Злодей выпуска"
    prompt: "a charismatic corporate tycoon villain man in a white suit with a glowing purple prototype energy core on his chest, slicked silver hair"

# --- Предметы: одна картинка на вещь ---------------------------------------------
# Битки для боя на фишках (вещь «в руке»)
weapons:
  bat:        {title: "Бита",         prompt: "a wooden baseball bat with black grip tape"}
  knuckles:   {title: "Кастет",       prompt: "silver knuckle-duster weapon: one metal bar with four finger rings in a row, flat front view"}
  crowbar:    {title: "Монтировка",   prompt: "red steel crowbar: one long straight bar with a curved split claw hook at one end and a flat chisel tip at the other, no hammer head, side view"}
  stun_baton: {title: "Шокер",        prompt: "a black police stun baton with blue electric sparks at the tip"}
  skateboard: {title: "Скейт",        prompt: "a skateboard with a flame graphic on the deck"}
  umbrella:   {title: "Зонт-трость",  prompt: "a closed black umbrella with a curved wooden handle"}

# Сюжетные вещи и иконки
props:
  prototype:  {title: "Прототип (Сердце мира)", prompt: "a glowing purple prototype energy core in a chrome casing with cables"}
  lockpicks:  {title: "Отмычки",      prompt: "a set of lockpicks in an open leather pouch"}
  keycard:    {title: "Ключ-карта",   prompt: "a white plastic security keycard with a magnetic stripe and a clip"}
  flash_drive: {title: "Флешка",      prompt: "a small black USB flash drive with a red cap"}
  badge:      {title: "Полицейский жетон", prompt: "a gold police badge in a worn black leather holder"}
  cash:       {title: "Пачка денег",  prompt: "a thick bundle of green banknotes held by a rubber band"}

