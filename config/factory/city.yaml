  cheat_sheet: {title: "Шпаргалка",    prompt: "a small folded paper note with scribbles"}
  eye:         {title: "Глаз",         prompt: "a single big cartoon eye with a blue iris"}
  piggy_bank:  {title: "Копилка",      prompt: "a pink piggy bank with a coin"}
  heart:       {title: "Сердце",       prompt: "a red heart"}
  flame:       {title: "Пламя",        prompt: "an orange flame"}
  crown:       {title: "Корона",       prompt: "a golden crown with red gems"}
  clover:      {title: "Клевер",       prompt: "a green four-leaf clover"}
  rocket:      {title: "Ракета",       prompt: "a red and white cartoon rocket"}
  ghost:       {title: "Призрак",      prompt: "a cute white cartoon ghost"}
  cat:         {title: "Кот",          prompt: "a grinning orange cat face"}
  smiley:      {title: "Смайлик",      prompt: "a yellow smiley face"}
  anchor:      {title: "Якорь",        prompt: "a navy blue anchor"}
  diamond:     {title: "Бриллиант",    prompt: "a sparkling light blue diamond"}
  horseshoe:   {title: "Подкова",      prompt: "a lucky silver horseshoe"}
  rainbow:     {title: "Радуга",       prompt: "a rainbow with two little clouds"}
  moon:        {title: "Луна",         prompt: "a sleepy yellow crescent moon with a nightcap"}
  sun:         {title: "Солнце",       prompt: "a smiling sun with sunglasses"}
  cactus:      {title: "Кактус",       prompt: "a green cactus in a pot"}
  pizza:       {title: "Пицца",        prompt: "a slice of pepperoni pizza"}
  ufo:         {title: "НЛО",          prompt: "a flying saucer with a green beam"}
  dragon:      {title: "Дракон",       prompt: "a small cute green dragon"}
  thumbs_up:   {title: "Класс",        prompt: "a hand giving a thumbs up"}
  boombox:     {title: "Магнитофон",   prompt: "a 90s boombox with big speakers"}
  cassette:    {title: "Кассета",      prompt: "a retro audio cassette tape"}
  banana:      {title: "Банан",        prompt: "a yellow banana"}
  duck:        {title: "Уточка",       prompt: "a yellow rubber duck"}
  robot:       {title: "Робот",        prompt: "a retro tin toy robot head"}
  alien:       {title: "Пришелец",     prompt: "a green alien head with big black eyes"}
  shuriken:    {title: "Сюрикен",      prompt: "a steel ninja throwing star"}
