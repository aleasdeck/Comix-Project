# --- Фоны (qwen) ------------------------------------------------------------------
# Локации берутся из config/backgrounds.yaml. Существующие 5 локаций города
# догенерируются только если каких-то вариаций нет.
backgrounds:
  # Глава 1, «Старый квартал»: street, alley, apartment (пролог) + новые
  # Глава 2, «Логово»: office, rooftop + новые
  locations: [street, alley, apartment, office, rooftop,
              diner, pawn_shop, subway, warehouse,
              parking, server_room, lab, penthouse, highway]

# Крупные планы для кадров миниигр: попытка и итог. Руки в перчатках, чтобы не
# зависеть от цвета кожи героя.
closeups:
  lock_try:      "extreme close-up of black-gloved hands picking an apartment door lock with lockpicks"
  lock_done:     "close-up of an apartment door swinging open, black-gloved hand holding lockpicks"
  safe_try:      "extreme close-up of a black-gloved hand turning the dial of an office wall safe"
  safe_done:     "close-up of an open office safe with documents and bundles of cash inside"
  hack_try:      "close-up of black-gloved hands typing on a keyboard in front of a monitor glowing with green code"
  hack_done:     "close-up of a plain unbranded flat computer monitor with a thin black frame, showing a big green unlocked padlock icon, no logos or brand marks anywhere"
  bomb_try:      "extreme close-up of black-gloved hands holding wire cutters over a homemade bomb with red, blue and yellow wires and a digital timer"
  bomb_done:     "close-up of a defused bomb with cut wires and a frozen digital timer"
  bag_try:       "close-up of a black-gloved hand carefully reaching into an open handbag in a crowded subway car"
  bag_done:      "close-up of a black-gloved hand holding a small black USB flash drive"
  stealth_try:   "high angle view of an underground parking garage with security cameras and their cones of light"
  stealth_done:  "close-up of a broken security camera hanging from a concrete ceiling, sparking"
  chase_try:     "a motorcycle weaving between cars in a city traffic jam, speed lines, dynamic low angle"
  chase_done:    "a motorcycle leaping over a car in city traffic, dramatic angle"
  haggle_try:    "close-up of a pawn shop counter with a shopkeeper's hands counting money next to an old watch"
  haggle_done:   "close-up of a handshake over a pawn shop counter"
